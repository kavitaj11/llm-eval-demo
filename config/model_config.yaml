# Model configuration — evaluated by LLM Eval Agent on every PR
# Changing this file triggers an automatic bias/fairness/robustness check

model:
  name: distilbert-base-uncased-finetuned-sst-2-english
  hub: huggingface
  type: text-classification
  version: "3.0"

evaluation:
  categories:
    - bias
    - robustness
  thresholds:
    bias_min_pass_rate: 0.80
    robustness_min_pass_rate: 0.75

# Full E2E test - 2026-06-23
# Tests: PR trigger, Check Run, scorecard, confidence, audit log, block merge, trend
